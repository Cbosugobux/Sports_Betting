<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Phoenix Picks — Live Total Estimator</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:900px;margin:24px auto;padding:0 12px}
    h1{margin:0 0 8px}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    label{display:block;font-size:14px;margin-bottom:4px}
    input,select,button{width:100%;padding:8px;font-size:16px}
    .card{border:1px solid #ddd;border-radius:10px;padding:16px;margin:14px 0}
    .pill{display:inline-block;padding:4px 10px;border-radius:999px;border:1px solid #ccc;margin-right:8px}
    .banner{padding:14px;border-radius:10px;margin-top:10px;font-weight:700}
    .go{background:#e7f7ed;border:1px solid #9ad1ae;color:#0a6b2b}
    .cautious{background:#fff6e5;border:1px solid #f1c27d;color:#7a4d00}
    .nogo{background:#fdecec;border:1px solid #f5a3a3;color:#8a1f1f}
    .muted{color:#666}
    small{color:#555}
    .mono{font-family:ui-monospace,monospace}
  </style>
</head>
<body>
<h1>Live Total Estimator — Phoenix Picks</h1>
<div class="muted">No model input needed — uses league scoring pace to estimate the final total.</div>

<div class="card">
  <div class="grid-3">
    <div>
      <label>Sport</label>
      <select id="sport">
        <option value="nba" selected>NBA</option>
        <option value="ncaab">NCAAB</option>
        <option value="wnba">WNBA</option>
        <option value="nfl">NFL</option>
      </select>
    </div>
    <div>
      <label>Book Live Total (L)</label>
      <input id="book_line" type="number" step="0.5" value="216.5">
    </div>
    <div>
      <label>Odds (American)</label>
      <input id="odds_us" type="number" step="1" value="-112">
    </div>
  </div>

  <h3 style="margin-top:16px">Game State</h3>
  <div class="grid-3">
    <div>
      <label>Current Score (sum)</label>
      <input id="score_sum" type="number" step="1" value="172">
    </div>
    <div>
      <label>Time Remaining (mm:ss)</label>
      <input id="time_left" type="text" value="08:00">
    </div>
    <div>
      <label>Side</label>
      <select id="side">
        <option value="under" selected>Under</option>
        <option value="over">Over</option>
      </select>
    </div>
  </div>

  <div class="grid-3" style="margin-top:12px">
    <div>
      <label>Bankroll ($)</label>
      <input id="bankroll" type="number" step="1" value="500">
    </div>
    <div>
      <label>Kelly Fraction</label>
      <select id="kelly_frac">
        <option value="0.33" selected>1/3 Kelly</option>
        <option value="0.25">1/4 Kelly</option>
        <option value="0.5">1/2 Kelly</option>
      </select>
    </div>
  </div>
</div>

<div class="card">
  <button id="run">Run Trigger + Sizing</button>
</div>

<div id="out" class="card" style="display:none">
  <div id="banner" class="banner"></div>
  <div class="grid-3" style="margin-top:10px">
    <div><span class="pill">Projected Final</span> <b class="mono" id="proj_total">–</b></div>
    <div><span class="pill">Edge (pts)</span> <b class="mono" id="edge_pts">–</b></div>
    <div><span class="pill">EV%</span> <b class="mono" id="ev_pct">–</b></div>
  </div>
  <div class="grid-3" style="margin-top:10px">
    <div><span class="pill">Model Win %</span> <b class="mono" id="p_model">–</b></div>
    <div><span class="pill">Stake ($)</span> <b class="mono" id="stake">–</b></div>
    <div><span class="pill">Implied (book)</span> <b class="mono" id="p_book">–</b></div>
  </div>
</div>

<script>
  const FULL_MIN={nba:48,ncaab:40,wnba:40,nfl:60};
  // league-average total and scoring rate (pts/min)
  const AVG_TOTAL={nba:226,ncaab:145,wnba:164,nfl:44};
  const SIGMA={nba:14,ncaab:10,wnba:9,nfl:12};

  function parseMMSS(t){const [m,s]=t.split(":").map(x=>parseInt(x||"0",10));return m+s/60;}
  function phi(x){const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;const sign=x<0?-1:1;const z=Math.abs(x)/Math.sqrt(2);const t=1/(1+p*z);const y=1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-z*z);return 0.5*(1+sign*y);}
  function usToDecimal(us){return us>=0?1+100/us:1+Math.abs(us)/100;}
  function impliedFromUS(us){return us>=0?100/(us+100):Math.abs(us)/(Math.abs(us)+100);}

  document.getElementById("run").addEventListener("click",()=>{
    const sport=document.getElementById("sport").value;
    const L=parseFloat(document.getElementById("book_line").value);
    const oddsUS=parseFloat(document.getElementById("odds_us").value);
    const score=parseFloat(document.getElementById("score_sum").value);
    const minsLeft=parseMMSS(document.getElementById("time_left").value);
    const side=document.getElementById("side").value;
    const bankroll=parseFloat(document.getElementById("bankroll").value);
    const kellyFrac=parseFloat(document.getElementById("kelly_frac").value);

    const tFull=FULL_MIN[sport];
    const tPlayed=tFull-minsLeft;
    const leagueRate=AVG_TOTAL[sport]/tFull;

    // simple pace projection: current pace × full time
    const currentRate=score/tPlayed;
    const projFinal=currentRate*tFull;

    // probability using normal approx
    const sigmaFull=SIGMA[sport];
    const z=(L-projFinal)/sigmaFull;
    const pUnder=phi(z);
    const pModel=(side==="under")?pUnder:1-pUnder;
    const b=usToDecimal(oddsUS)-1;
    const q=1-pModel;
    const fKelly=Math.max((b*pModel-q)/(b||1),0);
    const stake=bankroll*fKelly*kellyFrac;
    const evPct=(pModel*b-q)*100;
    const pBook=impliedFromUS(oddsUS)*100;
    const edgePts=projFinal-L;

    let recClass="nogo",recText="NO-GO";
    const need={nba:5,ncaab:4,wnba:4,nfl:6}[sport];
    if(Math.abs(edgePts)>=need && pModel>0.54){recClass="go";recText="GO";}
    else if(Math.abs(edgePts)>=need-1 && pModel>0.52){recClass="cautious";recText="CAUTIOUS GO";}

    document.getElementById("out").style.display="block";
    const banner=document.getElementById("banner");
    banner.className="banner "+recClass;
    banner.textContent=`${recText} — ${side.toUpperCase()} ${L}`;

    document.getElementById("proj_total").textContent=projFinal.toFixed(1);
    document.getElementById("edge_pts").textContent=edgePts.toFixed(1);
    document.getElementById("ev_pct").textContent=evPct.toFixed(1)+"%";
    document.getElementById("p_model").textContent=(pModel*100).toFixed(1)+"%";
    document.getElementById("stake").textContent="$"+stake.toFixed(2);
    document.getElementById("p_book").textContent=pBook.toFixed(1)+"%";
  });
</script>
</body>
</html>
