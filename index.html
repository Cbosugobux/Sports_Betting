<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Live Total Projection</title>
<style>
  body{font-family:-apple-system,system-ui,Roboto,Arial,sans-serif;margin:0;background:#0b0e14;color:#f1f5f9}
  .wrap{max-width:760px;margin:auto;padding:24px 14px 64px}
  .card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.25)}
  h1{font-size:1.4rem;margin:0 0 10px}
  h2{font-size:1.1rem;margin:0 0 8px;color:#cbd5e1}
  label{display:block;font-size:.9rem;margin:10px 0 6px;color:#cbd5e1}
  input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#0b1220;color:#e5e7eb}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .btn{margin-top:14px;width:100%;padding:12px;border-radius:10px;border:none;background:#10b981;color:#041b11;font-weight:700;font-size:1rem}
  .btn:active{transform:translateY(1px)}
  .pill{background:#0b1220;border:1px solid #334155;border-radius:10px;padding:12px;text-align:center}
  .muted{color:#94a3b8;font-size:.9rem}
  .good{color:#34d399}.bad{color:#f87171}.warn{color:#fbbf24}
  .bar{height:8px;border-radius:6px;background:#1e293b;margin-top:6px;overflow:hidden}
  .bar div{height:8px;border-radius:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Live Total Projection (v2)</h1>
    <div class="muted">Dynamic late-game pace adjustment • works offline</div>
  </div>

  <div class="card">
    <h2>Inputs</h2>
    <label>League</label>
    <select id="league">
      <option value="CBB" selected>College Basketball (40 min)</option>
      <option value="NBA">NBA (48 min)</option>
    </select>

    <div class="row">
      <div><label>Home Score</label><input id="home" type="number" value="81"/></div>
      <div><label>Away Score</label><input id="away" type="number" value="67"/></div>
    </div>

    <div class="row">
      <div><label>Time Remaining (MM:SS)</label><input id="time" type="text" value="3:52"/></div>
      <div><label>Market Total (optional)</label><input id="market" type="number" placeholder="158.5"/></div>
    </div>

    <button class="btn" id="go">Project</button>
  </div>

  <div class="card" id="output" style="display:none">
    <h2>Results</h2>
    <div class="row">
      <div class="pill"><div class="muted">Naive Projection</div><div id="naive" style="font-size:1.3rem"></div></div>
      <div class="pill"><div class="muted">Adjusted Projection</div><div id="adjusted" style="font-size:1.3rem"></div></div>
    </div>
    <div class="row" style="margin-top:12px">
      <div class="pill"><div class="muted">Slowdown Applied</div><div id="slowpct"></div></div>
      <div class="pill"><div class="muted">Recommendation</div><div id="rec" style="font-size:1.1rem"></div><div class="bar"><div id="conf"></div></div></div>
    </div>
    <div class="row" id="marketRow" style="margin-top:14px;display:none">
      <div class="pill"><div class="muted">Market Total</div><div id="mkt"></div></div>
      <div class="pill"><div class="muted">Edge (Adj−Mkt)</div><div id="edge"></div></div>
    </div>
    <div class="muted" style="margin-top:8px">Auto-slowdown scales with time & margin; adds foul-fest boost when close under 2 min.</div>
  </div>
</div>

<script>
function parseMMSS(s){if(!s)return 0;const p=s.split(":").map(Number);return p[0]+(p[1]||0)/60}
function fmt(n){return Number.isFinite(n)?n.toFixed(1):"—"}

function dynamicAdjust({league,home,away,mmss}){
  const totalMin=league==="NBA"?48:40;
  const left=parseMMSS(mmss);const elapsed=totalMin-left;const score=home+away;
  if(elapsed<=0)return{err:"Clock error"};
  const pace=totalMin/elapsed;const naive=score*pace;
  const margin=Math.abs(home-away);
  // base slowdown curve
  let adjPct=0;
  if(left<4){adjPct=-0.06-0.005*margin;} // stronger late
  else if(left<8){adjPct=-0.03;}
  // foul-fest boost if close
  if(left<2 && margin<=4)adjPct+=0.05;
  const adjusted=naive*(1+adjPct);
  return{naive,adjusted,adjPct};
}

function verdict(edge,thr){
  if(!Number.isFinite(edge))return["—","warn",0];
  const abs=Math.abs(edge);
  if(edge>=thr)return["Over lean","good",Math.min(abs/6,1)];
  if(edge<=-thr)return["Under lean","bad",Math.min(abs/6,1)];
  return["No play","warn",abs/6];
}

document.getElementById("go").onclick=()=>{
  const league=document.getElementById("league").value;
  const home=+document.getElementById("home").value;
  const away=+document.getElementById("away").value;
  const mmss=document.getElementById("time").value;
  const market=parseFloat(document.getElementById("market").value);
  const res=dynamicAdjust({league,home,away,mmss});
  if(res.err){alert(res.err);return;}
  const {naive,adjusted,adjPct}=res;
  document.getElementById("output").style.display="block";
  document.getElementById("naive").textContent=fmt(naive);
  document.getElementById("adjusted").textContent=fmt(adjusted);
  document.getElementById("slowpct").textContent=(adjPct*100).toFixed(1)+"%";
  const thr=league==="NBA"?4:3;
  const mRow=document.getElementById("marketRow");
  if(Number.isFinite(market)){
    mRow.style.display="grid";
    const edge=adjusted-market;
    document.getElementById("mkt").textContent=fmt(market);
    document.getElementById("edge").textContent=(edge>=0?"+":"")+fmt(edge);
    const[v,cls,conf]=verdict(edge,thr);
    document.getElementById("rec").textContent=v;
    document.getElementById("rec").className=cls;
    const bar=document.getElementById("conf");
    bar.style.width=(conf*100)+"%";
    bar.style.background=cls==="good"?"#34d399":cls==="bad"?"#f87171":"#fbbf24";
  }else{
    mRow.style.display="none";
    document.getElementById("rec").textContent="Enter market for signal";
    document.getElementById("rec").className="warn";
    document.getElementById("conf").style.width="0";
  }
};
</script>
</body>
</html>
